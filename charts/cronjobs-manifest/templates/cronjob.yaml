{{- range $jobname, $job := .Values.jobs }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "cronjobs-manifest.releaseName" $ }}-{{ $jobname }}
  labels:
    {{- include "cronjobs-manifest.labels" $ | nindent 4 }}
spec:
  schedule: {{ $job.schedule | quote }}
  timeZone: {{ default "Asia/Bangkok" $job.timeZone | quote }}
  concurrencyPolicy: {{ default "Allow" $job.concurrencyPolicy }}
  failedJobsHistoryLimit: {{ default "1" $job.failedJobsHistoryLimit }}
  successfulJobsHistoryLimit: {{ default "3" $job.successfulJobsHistoryLimit }}
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: {{ include "cronjobs-manifest.releaseName" $ }}
            cron: {{ $jobname }}
        spec:
          {{- with $job.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 14 }}
          {{- end }}
          {{- if or (and (hasKey $.Values.global "affinity") $.Values.global.affinity) $job.affinity }}
          affinity:
            {{- toYaml (default $.Values.global.affinity $job.affinity) | nindent 12 }}
          {{- end }}
          {{- with $job.tolerations }}
          tolerations:
            {{- toYaml . | nindent 14 }}
          {{- end }}
          {{- $mergedVolumes := concat (default list $.Values.global.volumes) ($job.volumes | default list) }}
          {{- if $mergedVolumes }}
          volumes:
            {{- toYaml $mergedVolumes | nindent 10 }}
          {{- end }}
          restartPolicy: {{ default "OnFailure" $job.restartPolicy }}
          {{- with $job.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 10 }}
          {{- end }}
          {{- if and (hasKey $job "serviceAccount") (hasKey $job.serviceAccount "name") }}
          serviceAccountName: {{ $job.serviceAccount.name }}
          {{- end }}
          {{- if hasKey $job "securityContext" }}
          securityContext:
            {{- if $job.securityContext.runAsUser }}
            runAsUser: {{ $job.securityContext.runAsUser }}
            {{- end }}
            {{- if $job.securityContext.runAsGroup }}
            runAsGroup: {{ $job.securityContext.runAsGroup }}
            {{- end }}
            {{- if $job.securityContext.fsGroup }}
            fsGroup: {{ $job.securityContext.fsGroup }}
            {{- end }}
          {{- end }}
          containers:
          {{- $imageRepository := "" }}
          {{- $imageTag := "" }}
          {{- $imagePullPolicy := "" }}
          {{- if hasKey $job "image" }}
            {{- $imageRepository = $job.image.repository }}
            {{- $imageTag = $job.image.tag }}
            {{- $imagePullPolicy = $job.image.imagePullPolicy }}
          {{- else if hasKey $.Values.global "image" }}
            {{- $imageRepository = $.Values.global.image.repository }}
            {{- $imageTag = $.Values.global.image.tag }}
            {{- $imagePullPolicy = $.Values.global.image.imagePullPolicy }}
          {{- else }}
            {{- fail "Error: Either global.image or job.image must be defined!" }}
          {{- end }}
          - image: {{ $imageRepository }}:{{ $imageTag }}
            imagePullPolicy: {{ $imagePullPolicy }}
            name: {{ $jobname }}
            {{- $mergedEnv := dict }}
            {{- range $.Values.global.env }}
              {{- $_ := set $mergedEnv .name . }}
            {{- end }}
            {{- range $job.env }}
              {{- $_ := set $mergedEnv .name . }}
            {{- end }}
            {{- if $mergedEnv }}
            env:
              {{- range $key, $value := $mergedEnv }}
              - name: {{ $key }}
                value: "{{ index $value "value" }}"
              {{- end }}
            {{- end }}
            {{- with $job.envFrom }}
            envFrom:
              {{- toYaml . | nindent 14 }}
            {{- end }}
            {{- with $job.command }}
            command:
              {{- toYaml . | nindent 14 }}
            {{- end }}
            {{- with $job.args }}
            args:
              {{- toYaml . | nindent 14 }}
            {{- end }}
            {{- if or (and (hasKey $.Values.global "resources") $.Values.global.resources) $job.resources }}
            resources:
              {{- toYaml (default $.Values.global.resources $job.resources) | nindent 14 }}
            {{- end }}
            {{- $mergedVolumeMounts := concat (default list $.Values.global.volumeMounts) ($job.volumeMounts | default list) }}
            {{- if $mergedVolumeMounts }}
            volumeMounts:
              {{- toYaml $mergedVolumeMounts | nindent 14 }}
            {{- end }}
{{- end }}